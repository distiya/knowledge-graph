[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/git",
    "crates/langs",
    "crates/repository-config",
    "crates/tree-sitter-analyzer",
    "crates/scip-analyzer",
    "crates/joern-analyzer",
    "crates/normalizer",
    "crates/graph-delta",
    "crates/neo4j-store",
    "crates/deployment",
    "crates/graph-api",
    "crates/links",
    "crates/mcp-server",
    "apps/indexer",
    "apps/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/example/code-knowledge-graph"

[workspace.dependencies]
# Internal
ckg-domain = { path = "crates/domain" }
ckg-git = { path = "crates/git" }
ckg-langs = { path = "crates/langs" }
ckg-repository-config = { path = "crates/repository-config" }
ckg-tree-sitter-analyzer = { path = "crates/tree-sitter-analyzer" }
ckg-scip-analyzer = { path = "crates/scip-analyzer" }
ckg-joern-analyzer = { path = "crates/joern-analyzer" }
ckg-normalizer = { path = "crates/normalizer" }
ckg-graph-delta = { path = "crates/graph-delta" }
ckg-neo4j-store = { path = "crates/neo4j-store" }
ckg-deployment = { path = "crates/deployment" }
ckg-graph-api = { path = "crates/graph-api" }
ckg-links = { path = "crates/links" }
ckg-mcp-server = { path = "crates/mcp-server" }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Git
gix = { version = "0.66", features = ["max-performance-safe"] }

# Linguist
linguist = "0.1"

# Tree-sitter
tree-sitter = "0.27"
tree-sitter-language-pack = "1.20"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-sequel = "0.3"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-scala = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-elixir = "0.3"
tree-sitter-dart = "0.2"
tree-sitter-lua = "0.5"
tree-sitter-r = "1.3"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tree-sitter-hcl = "1.1"
tree-sitter-proto = "0.6"
tree-sitter-powershell = "0.26"
tree-sitter-make = "1.1"
tree-sitter-cmake = "0.7"
tree-sitter-swift = "0.7"
tree-sitter-haskell = "0.23"
tree-sitter-ocaml = "0.26"
tree-sitter-zig = "1.1"
tree-sitter-julia = "0.23"

# Hashing
sha2 = "0.10"
hex = "0.4"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Neo4j
neo4j = "0.2"

# HTTP / API
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# MCP
rmcp = { version = "0.2", features = ["server", "transport-io"] }

# Concurrency
rayon = "1.10"
dashmap = "6"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
tempfile = "3"
pretty_assertions = "1"
